name: OE3SRO Windows EXE

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (oe3sro-vX.Y.Z-N[-rcM]); leave empty for a build only'
        required: false
        type: string

concurrency:
  group: oe3sro-windows-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      - name: Derive artifact version
        id: version
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $source = Get-Content -Raw CMakeLists.txt
          $match = [regex]::Match($source, '(?s)project\s*\(\s*wsjtx\s+VERSION\s+(\d+\.\d+\.\d+)(?:\.\d+)?\s')
          if (!$match.Success) { throw 'Cannot derive WSJT-X version from CMakeLists.txt.' }
          $commit = (git rev-parse --short=9 HEAD).Trim()
          if ($LASTEXITCODE) { throw 'Cannot read source revision.' }
          $version = "$($match.Groups[1].Value)-devel-$commit-build$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $releaseTag = $env:REQUESTED_RELEASE_TAG
          $prerelease = 'false'
          if (!$releaseTag -and $env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('oe3sro-v')) {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          if ($releaseTag) {
            $tag = [regex]::Match($releaseTag, '^oe3sro-v(\d+\.\d+\.\d+)-([1-9]\d*)(?:-rc([1-9]\d*))?$')
            if (!$tag.Success -or $tag.Groups[1].Value -ne $match.Groups[1].Value) { throw 'Release tag must match oe3sro-vX.Y.Z-N[-rcM] and the CMake version.' }
            $version = "$($tag.Groups[1].Value)-oe3sro.$($tag.Groups[2].Value)"
            if ($tag.Groups[3].Success) {
              $version += "-rc$($tag.Groups[3].Value)"
              $prerelease = 'true'
            }
            $tagCommit = (git rev-parse "refs/tags/$releaseTag^{commit}").Trim()
            if ($LASTEXITCODE -or $tagCommit -ne (git rev-parse HEAD).Trim()) { throw 'Release must build the existing tag commit.' }
            $notes = "docs/releases/$version.md"
            if (!(Test-Path -LiteralPath $notes) -or [string]::IsNullOrWhiteSpace((Get-Content -Raw $notes))) {
              throw "Missing or empty release notes: $notes"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "commit=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - name: Install UCRT64 and Qt dependencies
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt5-base
            mingw-w64-ucrt-x86_64-qt5-multimedia
            mingw-w64-ucrt-x86_64-qt5-serialport
            mingw-w64-ucrt-x86_64-qt5-svg
            mingw-w64-ucrt-x86_64-qt5-tools
            mingw-w64-ucrt-x86_64-qt5-websockets
            mingw-w64-ucrt-x86_64-qt5-activeqt
            mingw-w64-ucrt-x86_64-fftw
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-libusb
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Set toolchain path
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $prefix = Join-Path $env:MSYS2_LOCATION 'ucrt64'
          "WSJTX_MINGW_PREFIX=$prefix" >> $env:GITHUB_ENV

      - name: Prepare pinned Hamlib and OmniRig dependencies
        run: ./tools/Setup-CustomBuild.ps1

      - name: Build Windows executables
        run: ./tools/Build-Custom.ps1

      - name: Verify PSK Reporter integration
        run: ./tools/Test-PskReporter.ps1

      - name: Verify web control without RF hardware
        run: ./tools/Test-WebControl.ps1

      - name: Verify logbook and UDP regressions
        run: ./tools/Test-Core.ps1

      - name: Verify FT8 FT4 FT2 native kernels and transmit audio
        run: ./tools/Test-TxQuality.ps1

      - name: Verify FT2 and FT4 codecs and SMP limits
        run: ./tools/Test-Ft2.ps1

      - name: Verify experimental REIST16 modem, QSO and production audio
        run: ./tools/Test-Reist16.ps1

      - name: Verify Pluto bridge without RF hardware
        run: ./tools/Test-PlutoBridge.ps1

      - name: Verify HackRF bridge and production SDR settings without RF hardware
        run: ./tools/Test-HackrfBridge.ps1

      - name: Prepare pinned Pluto runtime
        run: ./tools/Setup-PlutoBridge.ps1 -Download

      - name: Package EXE, DLLs, and station data
        run: ./tools/Package-Custom.ps1

      - name: Verify standalone package runtime
        run: ./tools/Verify-CustomPackage.ps1 -PortableOnly

      - name: Verify packaged HackRF FT8 17m launcher without hardware
        run: ./tools/Test-HackrfFt8Launcher.ps1 -Package "$PWD/dist-custom"

      - name: Create versioned Windows ZIP and checksum
        env:
          ARTIFACT_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/New-WindowsArtifact.ps1 -Version $env:ARTIFACT_VERSION

      - name: Upload Windows download
        id: download
        uses: actions/upload-artifact@v7
        with:
          name: wsjtx-OE3SRO-${{ steps.version.outputs.version }}-windows-x64
          path: |
            .local/windows-artifacts/*.zip
            .local/windows-artifacts/*.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Link download in build summary
        env:
          ARTIFACT_URL: ${{ steps.download.outputs.artifact-url }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          @"
          ## Windows x64 — build by OE3SRO

          **Version:** $env:ARTIFACT_VERSION

          [Download Windows EXE package]($env:ARTIFACT_URL)

          Contains the portable ZIP, documentation ZIP, SHA256 checksums, wsjtx.exe, decoders, Qt/OpenSSL DLLs, and station data.
          Extract both the artifact and the portable ZIP, then start **Start-WSJT-X.bat**.
          A GitHub login is required. Artifacts are retained for 90 days.
          "@ >> $env:GITHUB_STEP_SUMMARY

  release:
    if: needs.windows.outputs.release_tag != ''
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.windows.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: wsjtx-OE3SRO-${{ needs.windows.outputs.version }}-windows-x64
          path: release-assets
      - name: Publish versioned Windows release with documentation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.windows.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.windows.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_VERSION}.md"
          test -f "$notes"
          test -f "release-assets/wsjtx-OE3SRO-${RELEASE_VERSION}-windows-x64.zip"
          test -f "release-assets/wsjtx-OE3SRO-${RELEASE_VERSION}-documentation.zip"
          (cd release-assets && sha256sum --check ./*.sha256)
          # A failed upload leaves a draft that can safely be retried.
          # Published releases are immutable through this workflow.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if [ -n "$existing" ]; then
            if [ "$existing" != true ]; then
              echo '::error::Release is already published; use a new release tag.'
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --prerelease="$RELEASE_PRERELEASE" \
              --title "WSJT-X OE3SRO Custom ${RELEASE_VERSION}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/*.sha256 --clobber
          latest=true
          if [ "$RELEASE_PRERELEASE" = true ]; then latest=false; fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest" \
            --prerelease="$RELEASE_PRERELEASE" \
            --title "WSJT-X OE3SRO Custom ${RELEASE_VERSION}" --notes-file "$notes"
